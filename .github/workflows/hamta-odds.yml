name: Hämta odds

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: hamta-odds
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  hamta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Diagnos (gratis, inga krediter)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request
          from datetime import datetime, timezone
          k = os.environ["ODDS_API_KEY"]
          u = "https://api.the-odds-api.com/v4/sports/soccer_epl/events?apiKey=" + k
          with urllib.request.urlopen(u, timeout=60) as r:
              raw = r.read().decode()
              print("HTTP", r.status)
          d = json.loads(raw)
          print("svarstyp:", type(d).__name__)
          print("antal event:", len(d) if isinstance(d, list) else "EJ LISTA")
          print("nu utc:", datetime.now(timezone.utc).isoformat())
          print("rå början:", raw[:300])
          for e in (d if isinstance(d, list) else [])[:5]:
              print("  ", e.get("commence_time"), e.get("home_team"), "-", e.get("away_team"))
          PY

      - name: Vad finns inom 10 dygn (gratis)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_REGIONER: "se,eu"
          ODDS_MARKNADER: "h2h"
        run: python3 fetch_odds.py --ut odds --fonster 240 --torrkor

      - name: Hämta odds
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_REGIONER: "se,eu"
          ODDS_MARKNADER: "h2h"
        run: python3 fetch_odds.py --ut odds --fonster 3

      - name: Uppdatera filindex
        run: |
          mkdir -p odds
          ls -1 odds/*.csv 2>/dev/null | sort > odds/_index.txt || true
          wc -l < odds/_index.txt | xargs echo "Filer i index:"

      - name: Spara ny fil
        run: |
          if [ -z "$(git status --porcelain odds/)" ]; then
            echo "Inga nya filer – ingenting att committa."
            exit 0
          fi
          git config user.name  "odds-bot"
          git config user.email "odds-bot@users.noreply.github.com"
          git add odds/
          git commit -m "Odds $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
